  previewVoice(t) {
    if (this.state.voicePlaying === t) { this.stopVoice(); this.setState({ voicePlaying: null }); return; }

    let synth = null;
    try { synth = window.speechSynthesis; } catch (e) {}

    const pool = vs.filter(v => /^(en[-_](IN|GB)|hi[-_]IN)/i.test(v.lang));

  componentDidMount() {
    this.hotEls = [];
    this.onResize = () => this.computeScale();
    this.onKey = (e) => { if (e.key === 'Escape') this.back(); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('keydown', this.onKey);
    this.computeScale();
    const saved = localStorage.getItem('ml-app-current');
    if (saved && window.ML_SCREENS && window.ML_SCREENS[saved]) this.setState({ current: saved });
    this.armAuto(saved || this.state.current);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
    clearTimeout(this.autoT);
    this.stopVoice();
    this.killTimers();
  }

  computeScale() { this.forceUpdate(); }

  norm(s) { return (s || '').replace(/\s+/g, ' ').trim().replace(/Vedha/g, 'Drona'); }

  rulesFor(cur) { return (this.NAV[cur] || []).concat(this.GLOBAL); }

  matchText(rule, text) {
    if (rule.t === '*') return false;
    if (rule.m === 's') return text.startsWith(rule.t) && text.length <= rule.t.length + 130;
    if (rule.m === 'c') return text.includes(rule.t) && text.length <= 130;
    return text === rule.t;
  }

  findRule(rules, text, el, root) {
    const hits = rules.filter(r => this.matchText(r, text));
    if (!hits.length) return null;
    if (hits.some(r => r.occ != null) && el && root) {
      let cands = Array.from(root.querySelectorAll('*')).filter(n => this.norm(n.textContent) === text);
      cands = cands.filter(n => !Array.from(n.children).some(c => this.norm(c.textContent) === text));
      const idx = cands.findIndex(c => c === el || el.contains(c) || c.contains(el));
      const byOcc = hits.find(r => r.occ === idx);
      if (byOcc) return byOcc;
      return hits.find(r => r.occ == null) || null;
    }
    return hits[0];
  }

  armAuto(to) {
    clearTimeout(this.autoT);
    if (!(this.props.autoAdvance ?? true)) return;
    if (to === '09 Entering classroom') {
      this.autoT = setTimeout(() => {
        if (this.state.current === '09 Entering classroom') this.go('10L Live classroom');
      }, 6500);
    }
    if (to === '09L Entering lesson') {
      this.autoT = setTimeout(() => {
        if (this.state.current === '09L Entering lesson') this.go('19L Lesson landscape');
      }, 3400);
    }
  }

  go(to) {
    if (to === 'BACK') { this.back(); return; }
    if (!(window.ML_SCREENS && window.ML_SCREENS[to])) return;
    if (to === this.state.current) { this.setState(s => ({ tick: s.tick + 1 })); return; }
    this.navKind = this.kindFor(this.state.current, to);
    localStorage.setItem('ml-app-current', to);
    this.setState(s => ({ current: to, history: s.history.concat(s.current), tick: s.tick + 1 }));
    this.armAuto(to);
  }

  back() {
    clearTimeout(this.autoT);
    this.navKind = 'back';
    this.setState(s => {
      if (!s.history.length) return { current: '1a Home calm', history: [], tick: s.tick + 1 };
      const h = s.history.slice();
      const prev = h.pop();
      localStorage.setItem('ml-app-current', prev);
      return { current: prev, history: h, tick: s.tick + 1 };
    });
  }

  handleTap(e) {
    const root = e.currentTarget;
    const gEl = e.target.closest && e.target.closest('[data-go]');
    if (gEl && root.contains(gEl)) { this.go(gEl.getAttribute('data-go')); return; }
    const vEl = e.target.closest && e.target.closest('[data-voice]');
    if (vEl && root.contains(vEl)) { this.previewVoice(vEl.getAttribute('data-voice')); return; }
    const tEl = e.target.closest && e.target.closest('[data-teacher]');
    if (tEl && root.contains(tEl)) { this.setTeacher(tEl.getAttribute('data-teacher')); return; }
    const accEl = e.target.closest && e.target.closest('[data-acc]');
    if (accEl && root.contains(accEl)) {
      const panel = accEl.nextElementSibling;
      if (panel && panel.getAttribute('data-acc-panel')) {
        const isOpen = panel.style.display !== 'none';
        panel.style.display = isOpen ? 'none' : '';
        const chev = accEl.querySelector('svg');
        if (chev) chev.style.transform = isOpen ? '' : 'rotate(90deg)';
        const wrap = accEl.parentElement;
        if (wrap) wrap.style.cssText = isOpen
          ? 'border-bottom:1px dashed rgba(28,26,22,.08)'
          : 'border:1.5px solid rgba(238,163,31,.55);background:#FCF4E0;border-radius:14px;margin:5px 0';
        return;
      }
    }
    const rules = this.rulesFor(this.state.current);
    let el = e.target;
    while (el && el !== root) {
      const text = this.norm(el.textContent);
      if (text && text.length <= 200) {
        const r = this.findRule(rules, text, el, root);
        if (r) { this.go(r.to); return; }
      }
      el = el.parentElement;
    }
    const wc = rules.find(r => r.t === '*');
    if (wc) { this.go(wc.to); return; }
    this.flashHotspots();
  }

  markHotspots(root) {
    if (!root) return;
    const rules = this.rulesFor(this.state.current);
    const els = [];
    Array.from(root.querySelectorAll('*')).forEach(n => {
      const text = this.norm(n.textContent);
      if (!text || text.length > 200) return;
      if (rules.some(r => this.matchText(r, text))) {
        n.style.cursor = 'pointer';
        els.push(n);
      }
    });
    Array.from(root.querySelectorAll('[data-go],[data-act],[data-tsel]')).forEach(n => { n.style.cursor = 'pointer'; els.push(n); });
    // keep only innermost matched elements for the flash outline
    this.hotEls = els.filter(n => !els.some(o => o !== n && n.contains(o)));
    if (rules.some(r => r.t === '*')) root.style.cursor = 'pointer';
    if (this.props.showHotspots) this.outline(true);
  }

  outline(on) {
    (this.hotEls || []).forEach(n => {

  SHEET_SCREENS = { '07 Plan sheet':1, '08 Learn sheet':1, '08b Topic sheet':1, '14c Chapter focus':1, '15c Mock palette':1, '19b Lesson sections':1, '26 Report sheet':1 };

  NAV_TAGS = {

    '1a Home calm': ['tabs','home'], '07 Plan sheet': ['home'], '08 Learn sheet': ['home'], '08a Chapter selector': ['home'], '08b Topic sheet': ['home'],
    '14 Practice unanswered': ['prac'], '17 Progress': ['tabs'], '18 Lessons': ['tabs'],
    '20 Notes': ['tabs','lib'], '21 Doubts': ['lib'], '22 Sessions': ['lib'],
    '14b Practice revealed': ['prac'], '15 Mock locked': ['prac'], '15a Mock ready': ['prac'],
    '09 Entering classroom': ['live'], '10L Live classroom': ['live'], '09L Entering lesson': ['lesson'], '19L Lesson landscape': ['lesson'], '10 Live session': ['live'], '10b Drona asks': ['live'],
    '10c Session listening': ['live'], '10d Session paused': ['live'],

  LATERAL = [
    { order: ['02 Auth','02b Sign in','02c Reset password'], chrome: ['Create account','Sign in'] },
    { order: ['20 Notes','21 Doubts','22 Sessions'], chrome: ['Notes','Doubts','Sessions'] },
    { order: ['1a Home calm','18 Lessons','17 Progress','20 Notes'], chrome: [] },

  kindFor(from, to) {
    this.slideDir = null; this.slideChrome = null;

    if (this.LAND[from] && !this.LAND[to]) return 'toPort';
    if (this.SHEET_SCREENS[to]) return 'sheet';

      const i = g.order.indexOf(from), j = g.order.indexOf(to);

        this.slideChrome = g.chrome;

    if (cur === '08b Topic sheet') this.topicSheet(root);
    if (cur === '10 Live session') this.liveSession(root);
    if (cur === '10L Live classroom') this.landLive(root);
    if (cur === '19L Lesson landscape') this.landLesson(root);

  contentKids(root, chrome) {
    const screen = root.firstElementChild || root;
    const out = [];

    // CONTAINS the labels is much longer — recurse into it instead of skipping it
    const chromeLen = chrome && chrome.length ? chrome.join('').length + 40 : 0;
    const visit = (el, top) => {
      Array.from(el.children).forEach((c, i) => {
        if (top && i === 0) return; // status bar = static chrome
        if (c.getAttribute('data-ml-bar')) return;
        const st = c.getAttribute('style') || '';
        if (st.includes('position:absolute')) return;
        if (chrome && chrome.length) {
          const t = this.norm(c.textContent);
          const hits = chrome.filter(l => t.includes(l)).length;
          if (hits >= Math.min(2, chrome.length)) {
            if (t.length <= chromeLen) return; // IS the segmented header → pinned
            visit(c, false); // contains it → look inside

    this.contentKids(root, chrome).forEach(c => { c.style.animation = anim; });

  settleContent(root) {
    this.contentKids(root).forEach(c => { c.style.animation = 'mlSettle .24s ease-out both'; });
  }

  stickyTabBar(root) {
    const screen = root.firstElementChild || root;
    const bar = Array.from(screen.children).find(c => {
      const t = this.norm(c.textContent);
      return t.includes('Home') && t.includes('Drona') && t.includes('Library');

    if (bar) {

      screen.style.overflow = 'visible';

      bar.style.bottom = '0';
      bar.style.zIndex = '40';

      bar.setAttribute('data-ml-bar', '1');

  contentRise(root) {

    this.contentKids(root).forEach((c, i) => {

      c.style.animationDelay = (Math.min(i, 3) * 40) + 'ms';

      '<circle cx="60" cy="60" r="36" fill="none" stroke="#FCFAF4" stroke-width="11" stroke-linecap="round" stroke-dasharray="52 23.4" style="transform-origin:60px 60px;animation:ptOuter 6.5s cubic-bezier(.22,.8,.25,1) infinite"></circle>' +
      '<circle cx="60" cy="60" r="19" fill="none" stroke="#FCFAF4" stroke-width="9" stroke-linecap="round" stroke-dasharray="21.8 18" style="transform-origin:60px 60px;animation:ptInner 6.5s cubic-bezier(.22,.8,.25,1) infinite"></circle>' +
      '<path d="M112,60 A52,52 0 0 0 60,8" fill="none" stroke="#DD4433" stroke-width="1.4" stroke-dasharray="81.7" style="animation:ptArc1 6.5s linear infinite"></path>' +
      '<path d="M88,60 A28,28 0 0 0 84.25,46" fill="none" stroke="#DD4433" stroke-width="1.4" stroke-dasharray="14.7" style="animation:ptArc2 6.5s linear infinite"></path>' +
      '<text x="102" y="22" style="font-family:\'Kalam\';font-size:9px;fill:#EEA31F;animation:ptLbl1 6.5s linear infinite">\u221290\u00B0</text>' +

  }

  boardEngine(root) {
    const board = Array.from(root.querySelectorAll('div')).find(d => {
      const st = d.getAttribute('style') || '';

    });
    if (!board) return null;
    const steps = [];
    Array.from(board.children).forEach(el => {
      const tag = el.tagName.toLowerCase();
      if (tag === 'span') return;
      const txt = this.norm(el.textContent);
      if (tag === 'div' && (txt.includes('The board') || txt.includes('writing'))) return;
      if (tag === 'svg') {
        el.style.opacity = '0';
        el.style.transition = 'opacity .6s ease';
        steps.push({ svg: el, hold: 24 });
      } else {
        this.collectText(el).forEach(([node, full]) => steps.push({ node, full, i: 0 }));

    });

      if (eng.paused || eng.si >= steps.length) return;
      const st = steps[eng.si];
      if (st.svg) {

        st.hold -= 1;
        if (st.hold <= 0) eng.si += 1;
        return;

      st.node.textContent = st.full.slice(0, st.i);
      if (st.i >= st.full.length) { eng.si += 1; }
    }, 26));

  }

  loopCaption(root) {
    const cap = Array.from(root.querySelectorAll('div')).find(d => /#211C15|rgb\(33,\s*28,\s*21\)/.test(d.getAttribute('style') || ''));
    if (!cap) return null;
    const nodes = this.collectText(cap);
    if (!nodes.length) return null;
    const loop = { paused: false, i: 0, j: 0, wait: 8 };
    this.addTimer(setInterval(() => {
      if (loop.paused) return;
      if (loop.wait > 0) {
        loop.wait -= 1;
        if (loop.wait === 0) { loop.i = 0; loop.j = 0; nodes.forEach(([n]) => { n.textContent = ''; }); }
        return;
      }
      if (loop.i >= nodes.length) { loop.wait = 36; return; }
      const pair = nodes[loop.i];
      loop.j += 1;
      pair[0].textContent = pair[1].slice(0, loop.j);
      if (loop.j >= pair[1].length) { loop.i += 1; loop.j = 0; }
    }, 48));
    return loop;
  }

      e.stopPropagation();

  liveSession(root) {

  // ── landscape live classroom: writing engine + follow-scroll, chrome tuck, raise hand, CC
  landLive(root) {
    const $ = (q) => root.querySelector(q);
    const board = $('[data-role=board]'), ind = $('[data-role=ind]'), chip = $('[data-role=livechip]'),
      listen = $('[data-role=listen]'), cap = $('[data-role=capwrap]'), top = $('[data-role=top]'),

      if (rscrim) { rscrim.style.opacity = on ? '1' : '0'; rscrim.style.pointerEvents = on ? 'auto' : 'none'; }

      if (listen) { listen.style.opacity = on ? '1' : '0'; listen.style.pointerEvents = on ? 'auto' : 'none'; }
      if (on && chip) { chip.style.opacity = '0'; chip.style.pointerEvents = 'none'; }

        if (ind) {
          ind.style.height = Math.max(28, board.clientHeight * board.clientHeight / board.scrollHeight) + 'px';
          ind.style.top = (board.scrollTop / board.scrollHeight * board.clientHeight) + 'px';
          ind.style.opacity = '1';
          clearTimeout(this.indT2); this.indT2 = setTimeout(() => { ind.style.opacity = '0'; }, 900);
        }
        const atB = board.scrollTop + board.clientHeight >= board.scrollHeight - 40;
        if (chip) { chip.style.opacity = atB ? '0' : '1'; chip.style.pointerEvents = atB ? 'none' : 'auto'; }
      });
    }
    root.addEventListener('click', (e) => {
      e.stopPropagation();
      const goEl = e.target.closest && e.target.closest('[data-go]');
      if (goEl && root.contains(goEl)) { this.go(goEl.getAttribute('data-go')); return; }
      const row = e.target.closest && e.target.closest('[data-topic]');
      if (row && root.contains(row)) { setTopic(parseInt(row.getAttribute('data-topic'), 10)); setDrawer(false); return; }
      const act = e.target.closest && e.target.closest('[data-act]');
      const a = act && root.contains(act) ? act.getAttribute('data-act') : null;
      if (a === 'play') { setPlaying(!playing); return; }
      if (a === 'topics') { setDrawer(true); return; }
      if (a === 'closedrawer') { setDrawer(false); return; }
      if (a === 'jump') { if (board) board.scrollTo({ top: board.scrollHeight, behavior: 'smooth' }); return; }
      if (a === 'cc') {
        cc = !cc;
        if (cap) { cap.style.maxHeight = cc ? '60px' : '0'; cap.style.opacity = cc ? '1' : '0'; }
        act.style.background = cc ? '#FCF4E0' : '#fff';
        act.style.border = cc ? '1.4px solid rgba(238,163,31,.65)' : '1.4px solid rgba(28,26,22,.16)';
        act.style.color = cc ? '#9A6A12' : '#9C988C';
        return;
      }
      if (e.target.closest && e.target.closest('[data-role=drawer]')) return;
      setChrome(!chrome);
    });
  }

  lessonPlayer(root) {
    const eng = this.boardEngine(root);
    const cap = this.loopCaption(root);
    if (cap) cap.paused = true;
    const btn = Array.from(root.querySelectorAll('span')).find(sp => this.norm(sp.textContent) === 'Pause' && /#1C1A16|rgb\(28,\s*26,\s*22\)/.test(sp.getAttribute('style') || ''));
    if (!btn) { if (eng) eng.paused = false; if (cap) cap.paused = false; return; }
    const icon = btn.querySelector('svg');
    const label = Array.from(btn.childNodes).find(n => n.nodeType === 3 && n.textContent.trim());
    const setBtn = (playing) => {
      if (icon) icon.innerHTML = playing ? '<path d="M9 5v14M15 5v14"></path>' : '<path d="M8 6.2l10.5 5.8L8 17.8z" fill="currentColor" stroke="none"></path>';
      if (label) label.textContent = playing ? 'Pause' : 'Play';
    };
    setBtn(false);
    btn.style.cursor = 'pointer';
    let playing = false;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      playing = !playing;
      if (eng) eng.paused = !playing;
      if (cap) cap.paused = !playing;
      setBtn(playing);
    });
  }

  tickClock(root) {
    // find the raw text node holding hh:mm:ss (its parent span may contain an icon child)
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node = null, n;
    while ((n = w.nextNode())) {
      if (/^\s*\d{2}:\d{2}:\d{2}\s*$/.test(n.textContent)) { node = n; break; }
    }
    if (!node) return;
    let t = this.norm(node.textContent).split(':').reduce((a, v) => a * 60 + parseInt(v, 10), 0);
    this.addTimer(setInterval(() => {
      t = Math.max(0, t - 1);
      const h = String(Math.floor(t / 3600)).padStart(2, '0');
      const m = String(Math.floor((t % 3600) / 60)).padStart(2, '0');
      const sec = String(t % 60).padStart(2, '0');
      node.textContent = h + ':' + m + ':' + sec;
    }, 1000));
  }

  renderVals() {
    const cur = this.state.current;
    const isLand = !!this.LAND[cur];
    const W = isLand ? 844 : 390, H = isLand ? 390 : 844;
    const availW = window.innerWidth - 24;
    const availH = window.innerHeight - 24;
    const s = Math.max(0.4, Math.min(1, availW / W, availH / H));
    const T = this.teacherName();
    const screens = window.ML_SCREENS || {};
    const selS = 'border:1.6px solid #EEA31F;background:#FCF4E0';
    const unselS = 'border:1.4px solid rgba(28,26,22,.12);background:#fff';
    const html = (screens[cur] || '<div style="padding:60px 30px;font-family:sans-serif">Loading screens\u2026</div>')
      .replace(/Drona/g, T)
      .replace('__DSEL__', this.state.teacher !== 'vedha' ? selS : unselS)
      .replace('__VSEL__', this.state.teacher === 'vedha' ? selS : unselS)
      .replace('__DVOICE__', this.state.voicePlaying === 'drona' ? '◼ Stop' : '▶ Hear the voice')
      .replace('__VVOICE__', this.state.voicePlaying === 'vedha' ? '◼ Stop' : '▶ Hear the voice');

    let currentGroup = '';
    let currentLabel = cur;
    const groups = this.GROUPS.map(([name, items]) => ({
      name,
      items: items.map(([key, rawLabel]) => {
        const label = rawLabel.replace(/Drona/g, T);
        const active = key === cur;
        if (active) { currentGroup = name; currentLabel = label; }
        return {
          label, key,
          fw: active ? '800' : '600',
          color: active ? '#1C1A16' : '#57534B',
          bg: active ? 'rgba(238,163,31,.22)' : 'transparent',
          dot: active ? '#EEA31F' : 'rgba(28,26,22,.18)',
          go: () => this.go(key)
        };
      })
    }));

    const demoActions = (this.DEMO[cur] || []).map(([label, to]) => ({ label: label.replace(/Drona/g, T), go: () => this.go(to) }));

    // the phone frame stays static — all motion happens INSIDE the screen
    const kind = this.navKind || 'drill';
    const anim = kind === 'toLand' ? 'mlToLand .85s cubic-bezier(.3,.72,.25,1) both'
      : kind === 'toPort' ? 'mlToPort .7s cubic-bezier(.3,.72,.25,1) both'
      : kind === 'takeover' ? 'mlFade .25s ease both'
      : kind === 'swap' ? 'mlFade .12s ease both'
      : kind === 'slide' ? 'mlFade .16s ease both'
      : kind === 'back' ? 'mlFade .16s ease both'
      : 'mlFade .18s ease both';
    const screenEl = React.createElement('div',
      { style: { width: (W * s) + 'px', height: (H * s) + 'px' } },
      React.createElement('div', { style: { width: W + 'px', height: H + 'px', transform: 'scale(' + s + ')', transformOrigin: '0 0' } },
        React.createElement('div', {
          key: cur + ':' + this.state.tick,
          ref: (el) => {
            if (!el) return;
            const k = cur + ':' + this.state.tick;
            if (this._ek === k) return;
            this._ek = k;
            this.killTimers();
            this.markHotspots(el);
            this.enliven(el);
          },
          onClick: (e) => this.handleTap(e),
          style: {
            width: '100%', height: '100%', overflowY: 'auto', overflowX: 'hidden',
            borderRadius: '28px', animation: anim, scrollbarWidth: 'none',
            boxShadow: '0 46px 90px -44px rgba(28,26,22,.6)'
          },
          dangerouslySetInnerHTML: { __html: html }
        })
      )
    );

    return {
      groups, screenEl, demoActions,
      hasDemo: demoActions.length > 0,
      currentLabel, currentGroup,
      back: () => this.back(),
      restart: () => { clearTimeout(this.autoT); this.navKind = 'back'; localStorage.setItem('ml-app-current', '01 Welcome'); this.setState(s2 => ({ current: '01 Welcome', history: [], tick: s2.tick + 1 })); }
    };
  }
}
</script>
